services:
  - type: web
    name: beam-cloud
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python app.py --prepare
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: BEAM_SESSION_KEY
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
